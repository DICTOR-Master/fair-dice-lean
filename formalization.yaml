status:
  scope: >-
    Formalized (Challenge, five theorems): alexandrov_iff (for distinct unit
    vectors not all in one closed hemisphere and positive curvatures: a
    polytope with corners on the rays and these curvatures exists if and
    only if they sum to 4 pi and Alexandrov's condition holds);
    alexandrov_unique (such a polytope is unique up to scaling about the
    origin); solidAngle_eq_curvature (#112 Lemma 1); fair_die_iff and
    fair_die_unique (#112 Theorem A (a)). The library also proves the
    necessity half in the textbook form for spherically convex sets
    (Alexandrov/Hemisphere.lean), not in the Challenge.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

