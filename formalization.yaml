# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (Palomar submission kit; source rule: SOURCE-BASED, the paper #112 "formalizes")
version: "v0.4"

project:
  name: "Fair Dice from Curvature: Alexandrov's Theorem, Machine-Checked"
  description: >-
    DICTO's paper "Fair Dice — The Aequi: Enumerating the Innumerable"
    (Zenodo, 2026) proves, as its Theorem A (a), that a set of N distinct
    face directions, not all in one closed hemisphere, carries a die that is
    fair about its centre (every face seen under the solid angle 4 pi / N)
    exactly when the directions satisfy Alexandrov's condition for equal
    masses, and that the die is then unique up to scale. The proof passes to
    the polar polytope, whose corners lie on the face directions; the
    paper's Lemma 1 shows that the solid angle of a face equals the integral
    Gauss curvature of the polar polytope at the matching corner, so Theorem
    A (a) is Alexandrov's theorem on prescribed integral curvature
    (Alexandrov 1942, in the polytope case proved by Oliker 2007 and
    Bertrand 2016) for equal curvatures. This entry proves in Lean the
    polyhedral Alexandrov theorem itself (existence if and only if the
    curvatures sum to 4 pi and Alexandrov's condition holds; uniqueness up to
    scaling about the origin), Lemma 1 (the polar identity) and Theorem A
    (a) (existence and uniqueness of the fair die). Existence follows
    Oliker's variational route: a maximizer of his functional exists by
    continuity and coercivity, and at a maximizer every corner has the
    prescribed curvature. Uniqueness is by the maximum principle.
    Not formalized: Theorem A (b) (the symmetry group of the die) and (c)
    (the centre as centroid), the finite test for equal masses, and the rest
    of the paper (the enumeration). Audience: researchers on convex
    polytopes, the Minkowski and Alexandrov problems and fair dice, and
    Mathlib contributors.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"

