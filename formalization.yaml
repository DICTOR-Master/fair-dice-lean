fidelity:
  divergences: >-
    (1) The integral Gauss curvature at a point p of a set Q is three times
    the volume of the normal cone {x | for all q in Q, <q,x> <= <p,x>}
    inside the unit ball (curvature), which equals the area of the set of
    outer unit normals at p; no measure on the sphere is used. The solid
    angle of a face (solidAngle) is likewise three times the volume of the
    cone of directions through that face inside the unit ball. (2) "Not all
    in one closed hemisphere" is stated as: for every x /= 0 some n i has
    <n i, x> > 0. (3) Alexandrov's condition (AlexandrovCondition) is stated
    for every nonempty proper set I of the rays: the sum of the curvatures
    over I is less than the area of the open pi/2-neighbourhood of those
    rays. The papers state it for spherically convex sets; the library also
    proves the necessity in that form (Alexandrov/Hemisphere.lean), but the
    Challenge uses the form over sets of rays, and the equivalence of the
    two forms is not formalized. (4) The prescribed
    curvatures are positive (each corner is a corner); for the dice they are
    all 4 pi / N. (5) The polytope with corners on the rays is the convex
    hull of r i * n i (rayPolytope); the die is the intersection of the
    half-spaces <n j, x> <= d j (die), and its polar has corners n j / d j.
    (6) Uniqueness is up to scaling about the origin (r' = c r with c > 0,
    and d' = c d for the dice).

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Every definition and statement in the Challenge is copied from the Lean
    library (namespace Alexandrov renamed FairDice); the Solution is the
    Challenge word for word with each proof transferred from the library.
    The comparator was run locally with Lean's kernel, NanoDa and con-ron.
    Literature: #112 was read; Oliker 2007 and Bertrand 2016 were read for
    #112; Alexandrov 1942, Minkowski 1897 and Klain 2004 are cited only.
    Formal search (24 November 2026): web searches on Alexandrov's theorem,
    prescribed curvature and the Minkowski problem with Lean, Isabelle, Coq,
    "formalized" and "proof assistant"; the Lean Zulip archive ("Main
    Theorem of Polytope Theory", "Sofa problem may have been solved", the
    convex polytopes thread); Mathlib v4.35.0-rc2; Isabelle HOL-Analysis
    Polytope.thy and the AFP entry Euler's Polyhedron Formula; Coq-Polyhedra;
    the HOL Light polytope library; Mizar and Metamath by web search only.
    We found no earlier machine-checked proof of Alexandrov's theorem on
    prescribed curvature, of Minkowski's theorem for polytopes, or of the
    fair-die theorem; the nearest formal work is basic polytope theory.

alignment:
  namespace: "FairDice"
  statements:
    - source: "Alexandrov's theorem, polytope case (Oliker 2007, Theorems 4 and 6; Bertrand 2016, Theorem 1.2): existence"
      lean: "FairDice.alexandrov_iff"
      module: "Challenge"
      status: "proved"
    - source: "Alexandrov's theorem, polytope case: uniqueness up to scaling"
      lean: "FairDice.alexandrov_unique"
      module: "Challenge"
      status: "proved"
    - source: "#112, Lemma 1 (the polar identity)"
      lean: "FairDice.solidAngle_eq_curvature"
      module: "Challenge"
      status: "proved"
    - source: "#112, Theorem A (a), existence"
      lean: "FairDice.fair_die_iff"
      module: "Challenge"
      status: "proved"
    - source: "#112, Theorem A (a), uniqueness up to scale"
      lean: "FairDice.fair_die_unique"
      module: "Challenge"
      status: "proved"

